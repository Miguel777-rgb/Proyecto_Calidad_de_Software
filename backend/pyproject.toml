[project]
name = "ola"
version = "0.1.0"
description = "OLA — Observatorio Litoral de Anomalias termicas (IMARPE ATSM)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pyjwt>=2.15",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "sentry-sdk>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "mutmut>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ola"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Copia que genera mutmut: codigo mutado a proposito. Dentro del contenedor
# no se ve el .gitignore de la raiz, asi que se excluye aqui.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.mutmut]
# Pruebas de mutacion del dominio puro: mutmut altera el codigo (un < por un
# <=, un + por un -) y comprueba que alguna prueba unitaria lo detecte. Una
# mutacion que sobrevive senala una regla sin prueba que la fije.
#   docker compose exec api mutmut run && docker compose exec api mutmut results
paths_to_mutate = [
    "src/ola/domain/classification.py",
    "src/ola/domain/streaks.py",
    "src/ola/domain/freshness.py",
    "src/ola/domain/projection.py",
]
tests_dir = ["tests/unit/"]
# El conftest de las pruebas importa el resto del paquete: se copia sin mutar.
also_copy = ["src/ola/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: pruebas lentas, como la carga del dataset completo de 125k filas",
    "integration: requieren una base de datos PostgreSQL disponible",
]
# Ruido de librerias de terceros que no depende de nuestro codigo.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.coverage.run]
source = ["src/ola"]
omit = ["*/alembic/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
