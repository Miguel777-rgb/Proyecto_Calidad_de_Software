# OLA — despliegue en un VPS con Dokploy.
#
# Uso en Dokploy: crear un servicio de tipo Compose (NO Application, que
# intenta construir con Nixpacks y falla) apuntando a este archivo, y definir
# las variables en su interfaz. NO se usa un archivo .env en el servidor: los
# secretos se cargan desde Dokploy.
#
# Los dominios se configuran en la pestana Domains del servicio, no aqui:
# Dokploy inyecta al desplegar las etiquetas de Traefik y la red
# dokploy-network, sin la cual Traefik no alcanza los contenedores.
# Web y API comparten un mismo dominio y se separan por ruta:
#   - web -> Path /,    puerto 80
#   - api -> Path /api, puerto 8000, Internal Path / y Strip Path apagado
# La API ya espera el prefijo /api, por eso no se recorta. Traefik prioriza
# la regla mas larga, asi que /api gana sobre /.
#
#   docker compose -f compose.prod.yml up -d --build   (para probar en local)
#
# Diferencias con compose.yml: sin montajes de codigo, sin puertos publicados
# (Traefik enruta por dominio), sin Mailpit, y con las imagenes construidas
# en su etapa de produccion.

name: ola

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
      target: production
    restart: always
    environment:
      OLA_ENV: production
      OLA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLA_JWT_SECRET: ${OLA_JWT_SECRET}
      OLA_ACCESS_TOKEN_MINUTES: ${OLA_ACCESS_TOKEN_MINUTES:-60}
      OLA_ADMIN_EMAIL: ${OLA_ADMIN_EMAIL}
      OLA_ADMIN_PASSWORD: ${OLA_ADMIN_PASSWORD}
      # La web llama a la API en su mismo dominio, asi que el navegador no
      # aplica CORS. Se mantiene por si otro origen necesita consumir la API.
      OLA_CORS_ORIGINS: ${OLA_WEB_ORIGIN}
      OLA_SMTP_HOST: ${OLA_SMTP_HOST}
      OLA_SMTP_PORT: ${OLA_SMTP_PORT:-587}
      OLA_SMTP_USER: ${OLA_SMTP_USER}
      OLA_SMTP_PASSWORD: ${OLA_SMTP_PASSWORD}
      OLA_SMTP_TLS: ${OLA_SMTP_TLS:-true}
      OLA_MAIL_FROM: ${OLA_MAIL_FROM}
      OLA_LOG_LEVEL: ${OLA_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: production
      args:
        # Vite escribe esta direccion DENTRO del JavaScript al compilar.
        # Cambiarla exige reconstruir la imagen, no basta con reiniciar.
        VITE_API_URL: ${OLA_API_URL}
    restart: always
    depends_on:
      - api

volumes:
  pgdata:
