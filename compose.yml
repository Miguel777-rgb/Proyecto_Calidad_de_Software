# OLA — entorno de desarrollo local.
# Uso: cp .env.example .env && docker compose up -d --build
# Los puertos se definen en .env para evitar choques con servicios locales.

name: ola

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      OLA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./dataset:/dataset:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      # La web importa packages/compartido, asi que se construye desde la raiz.
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    working_dir: /repo/frontend
    environment:
      # Ruta relativa: el navegador pide al mismo origen y Vite hace de
      # proxy hacia `api`. Es el mismo comportamiento que Nginx en
      # produccion, y ademas funciona desde el contenedor de pruebas E2E.
      VITE_API_URL: /api
      # Sin sondeo, los cambios hechos en el equipo no llegan a Vite dentro
      # del contenedor y el navegador (y las E2E) ven codigo desactualizado.
      VITE_WATCH_POLLING: "true"
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      # Se monta el repositorio entero: la web lee packages/compartido. Los
      # node_modules van en volumenes porque los instala Linux, no el equipo.
      - ./:/repo
      - web_node_modules:/repo/node_modules
      - web_node_modules_frontend:/repo/frontend/node_modules
      - web_node_modules_compartido:/repo/packages/compartido/node_modules
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Pruebas de extremo a extremo. No arranca con `up`: se invoca con
  # docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    # La version de la imagen DEBE coincidir con @playwright/test en
    # frontend/package.json, que esta fijada sin ^ por ese motivo.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /repo/frontend
    environment:
      # El almacen de pnpm en un volumen propio: sin esto pnpm lo crea dentro
      # del repositorio montado, en el equipo, y Vite lo vigila.
      npm_config_store_dir: /pnpm-store
      E2E_BASE_URL: http://web:5173
      E2E_API_URL: http://api:8000
      # Credenciales del administrador creado al arrancar la API, para
      # probar el acceso por rol sin sembrar datos a mano.
      E2E_ADMIN_EMAIL: ${OLA_ADMIN_EMAIL}
      E2E_ADMIN_PASSWORD: ${OLA_ADMIN_PASSWORD}
      # Las E2E comprueban el correo entregado contra Mailpit.
      E2E_MAILPIT_URL: http://mailpit:8025
      CI: "1"
    volumes:
      - ./:/repo
      - e2e_node_modules:/repo/node_modules
      - e2e_node_modules_frontend:/repo/frontend/node_modules
      - e2e_node_modules_compartido:/repo/packages/compartido/node_modules
      - e2e_pnpm_store:/pnpm-store
    depends_on:
      - web
      - api
      - mailpit
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.2 --activate &&
             pnpm install --frozen-lockfile --filter ola-frontend... &&
             pnpm exec playwright test"

  # Disponibilidad del backend (metrica del plan de calidad, docs/calidad.md).
  # Consulta /api/health/ready cada minuto mientras el entorno esta levantado.
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma:/app/data
    depends_on:
      - api

  # Scripts del plan de calidad: configurar Uptime Kuma y sacar el informe de
  # disponibilidad. No arranca con `up`:
  #   docker compose --profile calidad run --rm calidad configurar.py
  #   docker compose --profile calidad run --rm calidad reporte.py --horas 168
  #   docker compose --profile calidad run --rm calidad -m pytest
  calidad:
    profiles: ["calidad"]
    image: python:3.13-slim
    working_dir: /herramienta
    environment:
      UPTIME_KUMA_URL: http://uptime-kuma:3001
      UPTIME_KUMA_USUARIO: ${UPTIME_KUMA_USUARIO}
      UPTIME_KUMA_CLAVE: ${UPTIME_KUMA_CLAVE}
      OLA_SALUD_URL: http://api:8000/api/health/ready
      # Opcional: el sistema desplegado, para medir tambien su disponibilidad.
      OLA_VPS_URL: ${OLA_VPS_URL:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./tools/uptime-kuma:/herramienta
      - calidad_pip:/root/.cache/pip
    depends_on:
      - uptime-kuma
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore -r requirements.txt && exec python \"$$@\"", "--"]

volumes:
  pgdata:
  web_node_modules:
  web_node_modules_frontend:
  web_node_modules_compartido:
  e2e_node_modules:
  e2e_node_modules_frontend:
  e2e_node_modules_compartido:
  e2e_pnpm_store:
  uptime_kuma:
  calidad_pip:
