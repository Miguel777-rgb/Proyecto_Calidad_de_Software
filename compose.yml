# OLA — entorno de desarrollo local.
# Uso: cp .env.example .env && docker compose up -d --build
# Los puertos se definen en .env para evitar choques con servicios locales.

name: ola

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      OLA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./backend:/app
      - ./dataset:/dataset:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      # Ruta relativa: el navegador pide al mismo origen y Vite hace de
      # proxy hacia `api`. Es el mismo comportamiento que Nginx en
      # produccion, y ademas funciona desde el contenedor de pruebas E2E.
      VITE_API_URL: /api
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Pruebas de extremo a extremo. No arranca con `up`: se invoca con
  # docker compose --profile e2e run --rm e2e
  e2e:
    profiles: ["e2e"]
    # La version de la imagen DEBE coincidir con @playwright/test en
    # frontend/package.json, que esta fijada sin ^ por ese motivo.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    environment:
      E2E_BASE_URL: http://web:5173
      E2E_API_URL: http://api:8000
      # Credenciales del administrador creado al arrancar la API, para
      # probar el acceso por rol sin sembrar datos a mano.
      E2E_ADMIN_EMAIL: ${OLA_ADMIN_EMAIL}
      E2E_ADMIN_PASSWORD: ${OLA_ADMIN_PASSWORD}
      CI: "1"
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    depends_on:
      - web
      - api
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.2 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm exec playwright test"

volumes:
  pgdata:
  node_modules:
  e2e_node_modules:
