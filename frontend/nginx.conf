server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en su propio subdominio, asi que aqui solo se sirve la
    # aplicacion. Traefik, en Dokploy, enruta cada dominio a su contenedor.

    # Los archivos con huella en el nombre no cambian nunca; el index si.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aplicacion de una sola pagina: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
