server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API comparte dominio, pero Traefik, en Dokploy, manda las rutas /api
    # a su contenedor antes de llegar aqui, asi que este servidor solo sirve
    # la aplicacion.

    # Los archivos con huella en el nombre no cambian nunca; el index si.
    # Cada location con add_header propio repite el include de seguridad:
    # nginx no hereda las cabeceras del server en esos location.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguridad.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/seguridad.conf;

    # Aplicacion de una sola pagina: cualquier ruta desconocida sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
