# Cabeceras de seguridad de todas las respuestas de la web.
#
# nginx.conf incluye este archivo en el server y en cada location que define
# sus propias cabeceras: nginx no hereda los add_header del nivel superior en
# un location que tiene los suyos. Antes estaban solo en el server, y el
# index.html y los archivos de /assets/ salian sin ninguna.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Solo HTTPS durante un ano. Por HTTP, como al probar compose.prod.yml en
# local, el navegador la ignora.
add_header Strict-Transport-Security "max-age=31536000" always;

# Scripts, estilos, fuentes y peticiones solo del propio dominio; imagenes
# tambien de los mosaicos de OpenStreetMap. Los estilos admiten 'unsafe-inline'
# porque Leaflet inserta el HTML de cada marcador con style="--estado: ...";
# los scripts no, que es lo que protege contra la inyeccion de codigo. Las
# fuentes admiten data: porque Vite incrusta en el CSS los archivos de menos
# de 4 kB, como algunos subconjuntos de Inter y Space Grotesk.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
