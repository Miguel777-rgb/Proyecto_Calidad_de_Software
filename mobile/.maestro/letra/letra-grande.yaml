# El script sube la letra del celular al 200 % (font_scale 2.0) antes.
appId: pe.ola.app
name: Con la letra al 200 % no se pierde nada
tags: [letra]
---
- launchApp:
    stopApp: true
- assertVisible: Estado del mar en la costa
- extendedWaitUntil:
    visible:
      id: fecha-referencia
    timeout: 15000
# Las cuatro pestanas siguen a la vista y con su nombre completo.
- assertVisible: Mapa
- assertVisible: Histórico
- assertVisible: Comparar
- assertVisible: Próximos días
- assertVisible:
    id: entrar
- takeScreenshot: informes/capturas/letra-200
- scrollUntilVisible:
    element:
      id: atribucion
    direction: DOWN
