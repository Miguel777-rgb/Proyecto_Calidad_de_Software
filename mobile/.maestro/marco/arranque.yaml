# La app abre en el mapa con el estado que trae de la API real.
appId: pe.ola.app
name: Arranca en el mapa con la fecha del dato
tags: [marco]
---
- launchApp:
    clearState: true
- assertVisible: Estado del mar en la costa
- extendedWaitUntil:
    visible:
      id: fecha-referencia
    timeout: 15000
- assertVisible: "[0-9]{2}/[0-9]{2}/[0-9]{4}"
- assertVisible:
    id: pestana-index
    selected: true
- takeScreenshot: informes/capturas/arranque
