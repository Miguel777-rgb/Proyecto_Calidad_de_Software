# Sin sesion la banda ofrece entrar; «atras» vuelve al mapa.
appId: pe.ola.app
name: Entrar abre su pantalla y atras vuelve
tags: [marco]
---
# Sin sesion guardada: otro flujo pudo dejarla iniciada.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: fecha-referencia
    timeout: 20000
- tapOn:
    id: entrar
- assertVisible: Iniciar sesión
- assertVisible:
    id: entrar-correo
- back
- assertVisible: Estado del mar en la costa
